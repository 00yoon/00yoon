<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="/manifest.webmanifest">
<title>수학 풀이 교실</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <h1 style="text-align:center;margin-bottom:6px">✏️ 수학 풀이 교실</h1>
    <p class="muted" style="text-align:center;margin:0 0 20px">태블릿으로 풀고, 선생님과 함께 봐요</p>
    <div class="card">
      <div class="tabs">
        <button id="tab-s" class="on" type="button">학생</button>
        <button id="tab-t" type="button">선생님</button>
      </div>
      <form id="form-s" class="col">
        <label class="field">학번 <input id="s-no" inputmode="numeric" autocomplete="username" placeholder="예) 20315" required></label>
        <label class="field">비밀번호 (숫자 4자리) <input id="s-pw" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required></label>
        <button class="primary" type="submit">입장하기</button>
      </form>
      <form id="form-t" class="col hidden">
        <label class="field">아이디 <input id="t-id" autocomplete="username" required></label>
        <label class="field">비밀번호 <input id="t-pw" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <p id="err" class="small" style="color:var(--bad);min-height:1.2em;margin:10px 0 0"></p>
    </div>
  </div>
</div>
<script type="module">
import { api, auth, $ } from "/js/common.js";
const u = auth.user;
if (auth.token && u) location.replace(u.kind === "teacher" ? "/teacher" : "/student");

const tabs = { s: [$("#tab-s"), $("#form-s")], t: [$("#tab-t"), $("#form-t")] };
function show(k) {
  for (const [key, [tab, form]] of Object.entries(tabs)) { tab.classList.toggle("on", key === k); form.classList.toggle("hidden", key !== k); }
  localStorage.setItem("loginTab", k);
  $("#err").textContent = "";
}
$("#tab-s").onclick = () => show("s");
$("#tab-t").onclick = () => show("t");
show(localStorage.getItem("loginTab") || "s");
$("#s-no").value = localStorage.getItem("lastStudentNo") || "";

$("#form-s").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api("/login/student", { method: "POST", body: { studentNo: $("#s-no").value, password: $("#s-pw").value } });
    localStorage.setItem("lastStudentNo", $("#s-no").value);
    auth.set(r.token, r.user);
    location.href = "/student";
  } catch (err) { $("#err").textContent = err.message; $("#s-pw").value = ""; }
};
$("#form-t").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api("/login/teacher", { method: "POST", body: { loginId: $("#t-id").value, password: $("#t-pw").value } });
    auth.set(r.token, r.user);
    location.href = "/teacher";
  } catch (err) { $("#err").textContent = err.message; }
};
</script>
</body>
</html>
