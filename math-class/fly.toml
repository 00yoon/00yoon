# Fly.io 배포 설정 — 자세한 절차는 DEPLOY.md 참고
# app 이름은 전 세계에서 유일해야 하므로 `fly launch --no-deploy --copy-config` 때 바꾸세요.
app = "math-class-change-me"
primary_region = "nrt"   # 도쿄 (한국에서 가장 가까운 Fly 리전)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"
  # ADMIN_PASSWORD 는 여기 쓰지 말고 `fly secrets set ADMIN_PASSWORD=...` 로 넣으세요.

# 영구 디스크: `fly volumes create math_data --region nrt --size 1` 로 먼저 만듭니다.
[mounts]
  source = "math_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 수업 중 실시간 연결(WebSocket)이 끊기지 않도록 머신을 계속 켜 둡니다.
  # 비용을 줄이려면 "stop" + min_machines_running = 0 으로 바꿀 수 있지만,
  # 첫 접속이 몇 초 느려지고 수업 중 실시간 상태가 초기화될 수 있습니다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
