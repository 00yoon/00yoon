name: math-class

on:
  push:
    paths: ["math-class/**", ".github/workflows/math-class.yml"]
  pull_request:
    paths: ["math-class/**", ".github/workflows/math-class.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math-class
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: math-class/package-lock.json
      - run: npm ci
      - run: npm test
